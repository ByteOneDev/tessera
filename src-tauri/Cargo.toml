[package]
name = "tessera"
version = "0.1.0"
description = "Tessera : atelier de création de mods NeoForge"
authors = ["ByteOneDev"]
license = ""
repository = "https://github.com/ByteOneDev/tessera"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
base64 = "0.23"
reqwest = { version = "0.13", features = ["blocking"] }
flate2 = "1.1"
tar = "0.4"
zip = "9"
